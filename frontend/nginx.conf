server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The frontend calls /api/... relatively; in development the Vite dev server proxies it,
    # in the container nginx does. So the deployed app is same-origin and needs no CORS.
    # "backend" is the service name in docker-compose.yml and in the k8s manifests.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
