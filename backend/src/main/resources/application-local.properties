spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true

# the in-memory DB starts empty on every run, so the news feed needs the demo articles
app.fixtures.enabled=true

# separate from the docker-compose "uploads" volume path; deleted on shutdown by
# admin.storage.LocalUploadsCleanup, so local test runs never leave files behind
app.storage.local.base-path=.local-uploads