spring.application.name=backend

# Credentials come from the environment (Kubernetes secret in production),
# the defaults are for a local Postgres container only.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/portfolio}
spring.datasource.username=${DB_USERNAME:portfolio}
spring.datasource.password=${DB_PASSWORD:portfolio}

# Phase 1 derives the schema from the entities. Caveat: "update" only adds, it never
# drops or narrows columns - to be replaced by real migrations before the first
# deployment (see phasenplan.md, phase 2).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# no lazy loading inside the view layer - all fetching stays in the services
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Only the health endpoint is exposed; it feeds the container liveness/readiness probes.
# "probes.enabled" adds the /actuator/health/{liveness,readiness} groups, "show-details=never"
# keeps DB hostnames and versions out of a publicly reachable response.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
# a slow/unreachable SMTP relay must not fail the k8s liveness/readiness probes
management.health.mail.enabled=false

app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
app.jwt.expiration-minutes=60

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Bootstraps the first ADMIN account; registration always creates USER accounts.
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Seeds demo content (see blog/config/BlogArticleFixture) on an empty database.
# Off by default so production never gets fake articles; on locally and in docker-compose.
app.fixtures.enabled=${FIXTURES_ENABLED:false}

# "local" writes to the filesystem (see admin.storage.LocalFileStorageService); "oracle"
# will target Oracle Cloud Object Storage once the production deployment exists (not
# implemented yet, see phasenplan.md offene Pruefpunkte).
app.storage.provider=${STORAGE_PROVIDER:local}
app.storage.local.base-path=${STORAGE_LOCAL_BASE_PATH:uploads}
app.storage.local.public-path=/uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Newsletter send-out (NewsletterMailService). Defaults target a local MailHog instance
# (no auth, no TLS); production points this at Brevo's SMTP relay via env vars
# (see architektur-entscheidungen.md, Abschnitt "E-Mail/Newsletter").
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
app.mail.from=${MAIL_FROM:newsletter@example.com}
# Public site origin used to build absolute links (e.g. the linked article) inside newsletter emails.
app.site.base-url=${SITE_BASE_URL:http://localhost:5173}
