spring.application.name=backend

# Tests run against an in-memory database - no Postgres required.
spring.datasource.url=jdbc:h2:mem:portfolio-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# mirrors the production actuator setup - this file shadows the one in src/main/resources
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

app.jwt.secret=test-secret-test-secret-test-secret-test-secret
app.jwt.expiration-minutes=60

app.cors.allowed-origins=http://localhost:5173

app.admin.email=
app.admin.password=

app.storage.local.base-path=uploads
app.storage.local.public-path=/uploads
